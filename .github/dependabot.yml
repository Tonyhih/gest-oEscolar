# Revisão periódica das dependências (Fase 6: operação)
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      menores: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      menores: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
