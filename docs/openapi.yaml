        - { name: anoLectivo, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: classe, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: turno, in: query, schema: { $ref: '#/components/schemas/Turno' } }
      responses:
        '200':
          description: Turmas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Turma' } }
    post:
      tags: [Turmas e matrículas]
      summary: Criar turma (RF19) – DE, SE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TurmaEntrada' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turma' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Regra' }
  /turmas/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Turmas e matrículas]
      summary: Detalhe da turma com a lista de alunos (RF19)
      responses:
        '200':
          description: Turma
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Turma'
                  - type: object
                    properties:
                      alunos: { type: array, items: { $ref: '#/components/schemas/AlunoResumo' } }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Turmas e matrículas]
      summary: Actualizar turma (RF19) – DE, SE
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TurmaEntrada' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turma' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /turmas/{id}/atribuicoes:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Turmas e matrículas]
      summary: Professores atribuídos a cada disciplina da turma (RF20)
      responses:
        '200':
          description: Atribuições
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Atribuicao' } }
    put:
      tags: [Turmas e matrículas]
      summary: Definir as atribuições da turma (RF20) – DE, CO
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/Atribuicao' } }
      responses:
        '200':
          description: Actualizadas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Atribuicao' } }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Regra' }
  /matriculas:
    get:
      tags: [Turmas e matrículas]
      summary: Listar matrículas (RF21)
      parameters:
        - { name: anoLectivo, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: turma, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Matrículas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Matricula' } }
    post:
      tags: [Turmas e matrículas]
      summary: Matricular aluno numa turma (RF21) – SE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aluno, turma]
              properties:
                aluno: { $ref: '#/components/schemas/Uuid' }
                turma: { $ref: '#/components/schemas/Uuid' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matricula' }
        '409':
          description: Já existe matrícula activa no ano lectivo, ou a turma está cheia (RN06, RN07)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422': { $ref: '#/components/responses/Regra' }
  /matriculas/novas:
    post:
      tags: [Turmas e matrículas]
      summary: Ficha de matrícula de um aluno novo, numa só operação (RF44) – SE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aluno, turma]
              properties:
                aluno: { $ref: '#/components/schemas/AlunoEntrada' }
                encarregado:
                  type: object
                  required: [nome, telefone]
                  properties:
                    nome: { type: string }
                    telefone: { type: string }
                    parentesco: { type: string, default: Encarregado(a) }
                turma: { $ref: '#/components/schemas/Uuid' }
      responses:
        '201':
          description: Aluno, encarregado e matrícula criados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matricula' }
        '400': { $ref: '#/components/responses/Invalido' }
        '409': { $ref: '#/components/responses/Conflito' }
  /matriculas/importacao:
    post:
      tags: [Turmas e matrículas]
      summary: Importar uma lista de alunos novos para uma turma, tudo ou nada (RF45) – SE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turma, alunos]
              properties:
                turma: { $ref: '#/components/schemas/Uuid' }
                alunos:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [nome, dataNascimento, sexo]
                    properties:
                      nome: { type: string }
                      dataNascimento: { type: string, format: date }
                      sexo: { type: string, enum: [M, F] }
                      encarregadoNome: { type: string }
                      encarregadoTelefone: { type: string }
                      parentesco: { type: string }
      responses:
        '201':
          description: Importados
          content:
            application/json:
              schema:
                type: object
                properties:
                  importados: { type: integer }
                  matriculas: { type: array, items: { $ref: '#/components/schemas/Matricula' } }
        '400': { $ref: '#/components/responses/Invalido' }
        '409':
          description: A turma não tem vagas para todos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /matriculas/confirmacoes:
    post:
      tags: [Turmas e matrículas]
      summary: Confirmar a matrícula no novo ano lectivo (RF22) – SE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matriculaAnterior, turma]
              properties:
                matriculaAnterior: { $ref: '#/components/schemas/Uuid' }
                turma: { $ref: '#/components/schemas/Uuid' }
      responses:
        '201':
          description: Confirmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matricula' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Regra' }
  /matriculas/{id}/mudar-turma:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Turmas e matrículas]
      summary: Mudar de turma (RF23) – SE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turma, motivo]
              properties:
                turma: { $ref: '#/components/schemas/Uuid' }
                motivo: { type: string, minLength: 3 }
      responses:
        '200':
          description: Alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matricula' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /matriculas/{id}/anular:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Turmas e matrículas]
      summary: Anular matrícula (RF23) – SE
      requestBody:
        required: true
        content:
