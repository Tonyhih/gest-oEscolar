openapi: 3.1.0
info:
  title: Sistema de Gestão Escolar (Angola)
  version: 0.1.0
  description: |
    API REST de uma plataforma de gestão escolar para várias escolas, segundo o sistema de ensino angolano
    (Iniciação a 13.ª classe). A escola de cada pedido é sempre a do utilizador autenticado.
    Um recurso de outra escola responde 404.
servers:
  - url: http://localhost:3000/api/v1
    description: Desenvolvimento
  - url: https://exemplo.onrender.com/api/v1
    description: Produção (Render)
security:
  - bearer: []
tags:
  - name: Sistema
  - name: Autenticação
  - name: Plataforma
  - name: Utilizadores
  - name: Estrutura de ensino
  - name: Pessoas
  - name: Turmas e matrículas
  - name: Avaliação
  - name: Assiduidade
  - name: Estágio
  - name: Auditoria

paths:
  /saude:
    get:
      tags: [Sistema]
      summary: Verificação do estado da API
      security: []
      responses:
        '200':
          description: API a funcionar
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, example: ok }

  # ---------- Autenticação ----------
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Iniciar sessão (RF05)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, palavraPasse]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                palavraPasse: { type: string, minLength: 1 }
      responses:
        '200':
          description: Sessão iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  utilizador: { $ref: '#/components/schemas/UtilizadorSessao' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '429': { $ref: '#/components/responses/Limite' }
  /auth/eu:
    get:
      tags: [Autenticação]
      summary: Dados do utilizador autenticado
      responses:
        '200':
          description: Utilizador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UtilizadorSessao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /auth/palavra-passe:
    post:
      tags: [Autenticação]
      summary: Alterar a própria palavra-passe (RF06)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual, nova]
              properties:
                actual: { type: string }
                nova: { type: string, minLength: 8 }
      responses:
        '204': { description: Alterada }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '422': { $ref: '#/components/responses/Regra' }

  # ---------- Plataforma ----------
  /escola:
    get:
      tags: [Estrutura de ensino]
      summary: Dados da escola do utilizador
      responses:
        '200': { description: Escola }
    patch:
      tags: [Estrutura de ensino]
      summary: Decreto executivo de criação (aparece no certificado) – DE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decretoCriacao]
              properties:
                decretoCriacao: { type: string, example: '123/2015, de 10 de Março' }
      responses:
        '200': { description: Actualizada }
        '403': { $ref: '#/components/responses/Proibido' }
  /turmas/{id}/disciplinas/{disciplinaId}/mini-pauta:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/DisciplinaId'
      - $ref: '#/components/parameters/Trimestre'
    get:
      tags: [Avaliação]
      summary: Mini-pauta em PDF (RF46)
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Proibido' }
  /alunos/{id}/termo:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: anoLectivo, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [Pessoas]
      summary: Termo de frequência e aproveitamento em PDF (RF47) – SE, DE
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /alunos/{id}/certificados/previa:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: ciclo, in: query, required: true, schema: { type: string, enum: [primario, i_ciclo] } }
    get:
      tags: [Pessoas]
      summary: Prévia do certificado, com o que falta para o emitir (RF48) – SE, DE
      responses:
        '200': { description: 'Notas por classe, médias, completo, emFalta e dadosEmFalta' }
  /alunos/{id}/certificados:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Pessoas]
      summary: Emitir certificado numerado, ou rascunho sem número (RF48) – SE, DE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ciclo]
              properties:
                ciclo: { type: string, enum: [primario, i_ciclo] }
                livroRegisto: { type: string }
                conferidoPor: { type: string }
                rascunho: { type: boolean, default: false }
      responses:
        '201': { description: 'Documento emitido: id, numeroTexto (ex.: 1/2026), rascunho' }
        '422':
          description: Faltam notas ou dados pessoais (CERTIFICADO_INCOMPLETO)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /alunos/{id}/documentos:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pessoas]
      summary: Documentos emitidos para o aluno – SE, DE
      responses:
        '200': { description: Lista }
  /documentos/{id}/pdf:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pessoas]
      summary: Reimprimir um documento emitido, igual ao original – SE, DE
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /alunos/{id}/acesso-portal:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Pessoas]
      summary: Dar acesso ao portal ao aluno (RF50) – SE, DE
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '201': { description: 'Conta criada; a palavra-passe provisória só aparece nesta resposta' }
        '409': { $ref: '#/components/responses/Conflito' }
  /encarregados/{id}/acesso-portal:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Pessoas]
      summary: Dar acesso ao portal ao encarregado de educação (RF50) – SE, DE
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '201': { description: 'Conta criada; a palavra-passe provisória só aparece nesta resposta' }
        '409': { $ref: '#/components/responses/Conflito' }
  /tempos:
    get:
      tags: [Estrutura de ensino]
      summary: Tempos lectivos de um turno (RF52)
      parameters:
        - { name: turno, in: query, required: true, schema: { $ref: '#/components/schemas/Turno' } }
      responses:
        '200': { description: 'Tempos (predefinidos: true se ainda não foram configurados)' }
  /tempos/{turno}:
    parameters:
      - { name: turno, in: path, required: true, schema: { $ref: '#/components/schemas/Turno' } }
    put:
      tags: [Estrutura de ensino]
      summary: Definir os tempos lectivos do turno (RF52) – DE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: object, required: [inicio, fim], properties: { inicio: { type: string, example: '07:00' }, fim: { type: string, example: '07:45' } } }
      responses:
        '200': { description: Tempos gravados }
        '422': { $ref: '#/components/responses/Regra' }
  /turmas/{id}/horario:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Turmas e matrículas]
      summary: Horário semanal da turma (RF53)
      responses:
        '200': { description: Tempos e aulas }
    put:
      tags: [Turmas e matrículas]
      summary: Substituir o horário da turma (RF53) – DE, CO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [dia, tempo, disciplina]
                properties:
                  dia: { type: integer, minimum: 1, maximum: 6, description: '1 = segunda … 6 = sábado' }
                  tempo: { type: integer, minimum: 1, maximum: 10 }
                  disciplina: { $ref: '#/components/schemas/Uuid' }
                  sala: { type: string, description: 'Por omissão, a sala da turma' }
      responses:
        '200': { description: Horário gravado }
        '409':
          description: Conflito de professor ou de sala com outra turma (CONFLITO_HORARIO)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422': { $ref: '#/components/responses/Regra' }
  /horario/professor:
    get:
      tags: [Turmas e matrículas]
      summary: Horário do professor no ano lectivo activo (RF54) – PR
      responses:
        '200': { description: Tempos por turno e aulas }
  /portal/educandos:
    get:
      tags: [Pessoas]
      summary: Alunos a que a conta tem acesso (RF51) – encarregado, aluno
      responses:
        '200': { description: Lista de alunos }
  /portal/alunos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Pessoas]
      summary: 'Turma, notas publicadas, situação e faltas do aluno (RF51) – encarregado, aluno'
      responses:
        '200': { description: Resumo do aluno }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /plataforma/escolas:
    get:
      tags: [Plataforma]
      summary: Listar escolas (RF01, RF04) – só AP
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Escolas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      dados: { type: array, items: { $ref: '#/components/schemas/Escola' } }
        '403': { $ref: '#/components/responses/Proibido' }
    post:
      tags: [Plataforma]
      summary: Registar escola (RF01) – só AP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscolaEntrada' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Escola' }
        '400': { $ref: '#/components/responses/Invalido' }
        '409': { $ref: '#/components/responses/Conflito' }
  /plataforma/escolas/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Plataforma]
      summary: Activar ou desactivar escola (RF03) – só AP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { $ref: '#/components/schemas/Estado' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Escola' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /plataforma/escolas/{id}/director:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Plataforma]
      summary: Criar a conta do director da escola (RF02) – só AP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email]
              properties:
                nome: { type: string }
                email: { type: string, format: email }
      responses:
        '201':
          description: Director criado; a palavra-passe provisória é devolvida uma única vez
          content:
            application/json:
              schema:
                type: object
                properties:
                  utilizador: { $ref: '#/components/schemas/Utilizador' }
                  palavraPasseProvisoria: { type: string }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  # ---------- Utilizadores ----------
  /utilizadores:
    get:
      tags: [Utilizadores]
      summary: Listar utilizadores da escola (RF07) – DE
      parameters:
        - name: perfil
          in: query
          schema: { $ref: '#/components/schemas/Perfil' }
        - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Utilizadores
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      dados: { type: array, items: { $ref: '#/components/schemas/Utilizador' } }
    post:
      tags: [Utilizadores]
      summary: Criar utilizador da escola (RF07) – DE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, perfil]
              additionalProperties: false
              properties:
                nome: { type: string }
                email: { type: string, format: email }
                perfil:
                  type: string
                  enum: [secretaria, coordenador, professor]
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  utilizador: { $ref: '#/components/schemas/Utilizador' }
                  palavraPasseProvisoria: { type: string }
        '400': { $ref: '#/components/responses/Invalido' }
        '409': { $ref: '#/components/responses/Conflito' }
  /utilizadores/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Utilizadores]
      summary: Actualizar ou desactivar utilizador (RF09) – DE
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                estado: { $ref: '#/components/schemas/Estado' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Utilizador' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /utilizadores/{id}/repor-palavra-passe:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Utilizadores]
      summary: Repor palavra-passe (RF08) – DE
      responses:
        '200':
          description: Nova palavra-passe provisória
          content:
            application/json:
              schema:
                type: object
                properties:
                  palavraPasseProvisoria: { type: string }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  # ---------- Estrutura de ensino ----------
  /anos-lectivos:
    get:
      tags: [Estrutura de ensino]
      summary: Listar anos lectivos (RF10)
      responses:
        '200':
          description: Anos lectivos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AnoLectivo' } }
    post:
      tags: [Estrutura de ensino]
      summary: Criar ano lectivo com os 3 trimestres (RF10) – DE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnoLectivoEntrada' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnoLectivo' }
        '400': { $ref: '#/components/responses/Invalido' }
        '422': { $ref: '#/components/responses/Regra' }
  /anos-lectivos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Estrutura de ensino]
      summary: Alterar datas ou abrir/fechar trimestres (RF10) – DE
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnoLectivoEntrada' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnoLectivo' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Regra' }
  /anos-lectivos/{id}/activar:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Estrutura de ensino]
      summary: Tornar o ano lectivo activo (só um por escola) – DE
      responses:
        '200':
          description: Activado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnoLectivo' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /catalogo/classes:
    get:
      tags: [Estrutura de ensino]
      summary: Catálogo nacional de classes (Iniciação a 13.ª) (RF11)
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClasseCatalogo' } }
  /classes:
    get:
      tags: [Estrutura de ensino]
      summary: Classes oferecidas pela escola (RF11)
      responses:
        '200':
          description: Classes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Classe' } }
    post:
      tags: [Estrutura de ensino]
      summary: Oferecer uma classe do catálogo e configurar a avaliação (RF11, RF14) – DE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClasseEntrada' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classe' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Regra' }
  /classes/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Estrutura de ensino]
      summary: Alterar a configuração de avaliação (RF14) – DE
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfiguracaoAvaliacao' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classe' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Regra' }
  /cursos:
    get:
      tags: [Estrutura de ensino]
      summary: Listar cursos e áreas do II Ciclo (RF12)
      responses:
        '200':
          description: Cursos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Curso' } }
    post:
      tags: [Estrutura de ensino]
      summary: Criar curso (RF12) – DE, CO
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CursoEntrada' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Curso' }
        '409': { $ref: '#/components/responses/Conflito' }
  /cursos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Estrutura de ensino]
      summary: Actualizar ou desactivar curso (RF12) – DE, CO
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CursoEntrada' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Curso' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /disciplinas:
    get:
      tags: [Estrutura de ensino]
      summary: Listar disciplinas (RF13)
      responses:
        '200':
          description: Disciplinas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Disciplina' } }
    post:
      tags: [Estrutura de ensino]
      summary: Criar disciplina (RF13) – DE, CO
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisciplinaEntrada' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disciplina' }
        '409': { $ref: '#/components/responses/Conflito' }
  /disciplinas/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Estrutura de ensino]
      summary: Actualizar ou desactivar disciplina (RF13) – DE, CO
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisciplinaEntrada' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disciplina' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /planos-curriculares:
    get:
      tags: [Estrutura de ensino]
      summary: Plano curricular de uma classe e curso (RF13)
      parameters:
        - { name: classe, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: curso, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Planos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlanoCurricular' } }
    post:
      tags: [Estrutura de ensino]
      summary: Criar plano curricular (RF13) – DE, CO
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanoCurricularEntrada' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanoCurricular' }
        '409': { $ref: '#/components/responses/Conflito' }
  /planos-curriculares/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Estrutura de ensino]
      summary: Substituir as disciplinas do plano, incluindo as disciplinas-chave (RF13) – DE, CO
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanoCurricularEntrada' }
      responses:
