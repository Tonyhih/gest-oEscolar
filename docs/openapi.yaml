        '200':
          description: Gravadas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Falta' } }
        '403': { $ref: '#/components/responses/Proibido' }
        '422': { $ref: '#/components/responses/Regra' }
  /turmas/{id}/faltas:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: aluno, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: trimestre, in: query, schema: { type: integer, enum: [1, 2, 3] } }
    get:
      tags: [Assiduidade]
      summary: Listar faltas da turma (RF37)
      responses:
        '200':
          description: Faltas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Falta' } }
