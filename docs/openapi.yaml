              properties:
                motivo: { type: string, minLength: 3 }
      responses:
        '200':
          description: Anulada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matricula' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Regra' }

  # ---------- Avaliação ----------
  /turmas/{id}/disciplinas/{disciplinaId}/notas:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/DisciplinaId'
      - $ref: '#/components/parameters/Trimestre'
    get:
      tags: [Avaliação]
      summary: Grelha de notas da turma numa disciplina e trimestre (RF24, RF25)
      responses:
        '200':
          description: Notas com a MT calculada
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NotaTrimestre' } }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Avaliação]
      summary: Lançar as notas da turma em lote (RF24) – professor atribuído
      description: Só no trimestre aberto, antes da publicação. Valores dentro da escala da classe (RN05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [matricula]
                properties:
                  matricula: { $ref: '#/components/schemas/Uuid' }
                  mac: { type: [number, 'null'], minimum: 0, maximum: 20 }
                  npp: { type: [number, 'null'], minimum: 0, maximum: 20 }
                  npt: { type: [number, 'null'], minimum: 0, maximum: 20 }
      responses:
        '200':
          description: Gravadas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NotaTrimestre' } }
        '403': { $ref: '#/components/responses/Proibido' }
        '422': { $ref: '#/components/responses/Regra' }
  /turmas/{id}/disciplinas/{disciplinaId}/exame:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/DisciplinaId'
    put:
      tags: [Avaliação]
      summary: Lançar as notas da prova de exame (RF27) – só 6.ª, 9.ª e 12.ª
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [matricula, exame]
                properties:
                  matricula: { $ref: '#/components/schemas/Uuid' }
                  exame: { type: number, minimum: 0, maximum: 20 }
      responses:
        '200':
          description: Gravadas, com a CF calculada (RF28)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NotaFinal' } }
        '403': { $ref: '#/components/responses/Proibido' }
        '422': { $ref: '#/components/responses/Regra' }
  /turmas/{id}/avaliacoes-descritivas:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Trimestre'
    put:
      tags: [Avaliação]
      summary: Avaliação descritiva na Iniciação (RF33)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [matricula, texto]
                properties:
                  matricula: { $ref: '#/components/schemas/Uuid' }
                  texto: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Gravadas }
        '403': { $ref: '#/components/responses/Proibido' }
        '422': { $ref: '#/components/responses/Regra' }
  /turmas/{id}/trimestres/{n}/publicar:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: n, in: path, required: true, schema: { type: integer, enum: [1, 2, 3] } }
    post:
      tags: [Avaliação]
      summary: Fechar e publicar as notas do trimestre (RF30) – DT, DE
      responses:
        '200': { description: Publicadas }
        '403': { $ref: '#/components/responses/Proibido' }
        '422':
          description: Faltam notas por lançar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /notas/{id}/correccoes:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Avaliação]
      summary: Corrigir uma nota publicada (RF31) – DE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campo, valor, justificacao]
              properties:
                campo: { type: string, enum: [mac, npp, npt, exame], description: 'O trimestre é o da nota indicada no caminho' }
                valor: { type: number, minimum: 0, maximum: 20 }
                justificacao: { type: string, minLength: 10 }
      responses:
        '200':
          description: Corrigida e registada na auditoria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotaFinal' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Regra' }
  /turmas/{id}/pautas/trimestres/{n}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: n, in: path, required: true, schema: { type: integer, enum: [1, 2, 3] } }
    get:
      tags: [Avaliação]
      summary: Pauta trimestral (RF32)
      responses:
        '200':
          description: Pauta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pauta' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /turmas/{id}/pautas/final:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: formato, in: query, schema: { type: string, enum: [json, csv], default: json } }
    get:
      tags: [Avaliação]
      summary: Pauta final com MFD/CF e situação de transição (RF26, RF28, RF29, RF32, RF34)
      responses:
        '200':
          description: Pauta final
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pauta' }
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  # ---------- Assiduidade ----------
  /turmas/{id}/disciplinas/{disciplinaId}/faltas:
    parameters:
      - $ref: '#/components/parameters/Id'
